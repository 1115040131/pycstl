name: Bazel CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 初始状态检查
      run: |
        echo "===== 磁盘初始状态 ====="
        df -h /
        echo ""
        echo "===== 主要目录占用 ====="
        du -sh /home/runner/work 2>/dev/null || true
        du -sh ~/.cache 2>/dev/null || true

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        # 这里可以自定义需要删除哪些内容
        # 默认会删除 Android, .NET, Haskell 等，一般能腾出 10GB+ 空间
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: 清理后检查
      run: |
        echo "===== 磁盘初始状态 ====="
        df -h /
        echo ""
        echo "===== 主要目录占用 ====="
        du -sh /home/runner/work 2>/dev/null || true
        du -sh ~/.cache 2>/dev/null || true

    - name: 替换 CI 专用文件
      run: python3 .ci/patch_ci_file.py

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.18.0
      with:
        # Avoid downloading Bazel every time.
        bazelisk-cache: true
        # Store build cache per workflow.
        disk-cache: ${{ github.workflow }}
        # Share repository cache between workflows.
        repository-cache: true

    - name: 验证 Bazel 版本
      run: bazel --version

    - name: 启动 mysql 服务
      run: tool/build.py chat_prepare

    - name: 构建所有目标
      run: bazel build //...

    # --combined_report=lcov: 生成单个 lcov 格式报告
    # --test_output=errors: 只显示失败测试的日志，减少噪音
    - name: 生成测试覆盖率
      run: |
        bazel coverage //... \
          --combined_report=lcov \
          --test_output=errors \
          --nocache_test_results \
          --instrumentation_filter="//..."

    - name: 上传覆盖率报告
      if: runner.os == 'Linux'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./bazel-out/_coverage/_coverage_report.dat
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true

    - name: 构建后状态（缓存保存前）
      run: |
        echo "===== 构建后磁盘状态 ====="
        df -h /
        echo ""
        echo "===== Bazel 相关目录占用 ====="
        du -sh ~/.cache/bazel* 2>/dev/null || echo "bazel 缓存不存在"
        du -sh $(bazel info output_base 2>/dev/null) 2>/dev/null || echo "output_base 不存在"
        echo ""
        echo "===== 工作目录占用 ====="
        du -sh /home/runner/work/pycstl 2>/dev/null || true

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 clang-format
      run: sudo apt-get install -y clang-format

    - name: 检查代码格式
      run: |
        find src test -name '*.cc' -o -name '*.h' | xargs clang-format -i -style=Google
        git diff --exit-code