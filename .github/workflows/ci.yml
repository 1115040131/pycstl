name: Bazel CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 同一分支/PR 有新推送时取消进行中的旧 run,避免堆积浪费额度。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限:仅需读取代码。
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    steps:
    - name: 检出代码
      uses: actions/checkout@v7

    # TODO: adapt gcc 14
    - name: Remove GCC 14
      run: |
        sudo apt-get remove -y gcc-14 g++-14 libstdc++-14-dev
        sudo apt-get autoremove -y

    - name: 初始状态检查
      run: |
        echo "===== 磁盘初始状态 ====="
        df -h /
        echo ""
        echo "===== 主要目录占用 ====="
        du -sh /home/runner/work 2>/dev/null || true
        du -sh ~/.cache 2>/dev/null || true

    # - name: Free Disk Space (Ubuntu)
    #   uses: jlumbroso/free-disk-space@main
    #   with:
    #     # 这里可以自定义需要删除哪些内容
    #     # 默认会删除 Android, .NET, Haskell 等，一般能腾出 10GB+ 空间
    #     tool-cache: true
    #     android: true
    #     dotnet: true
    #     haskell: true
    #     large-packages: true
    #     docker-images: true
    #     swap-storage: true

    # - name: 清理后检查
    #   run: |
    #     echo "===== 磁盘清理后状态 ====="
    #     df -h /
    #     echo ""
    #     echo "===== 主要目录占用 ====="
    #     du -sh /home/runner/work 2>/dev/null || true
    #     du -sh ~/.cache 2>/dev/null || true

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        # Avoid downloading Bazel every time.
        bazelisk-cache: true
        # Store build cache per workflow.
        disk-cache: ${{ github.workflow }}-${{ matrix.os }}-build
        # Share repository cache between workflows.
        repository-cache: false

    - name: 验证 Bazel 版本
      run: bazel --version

    - name: 启动 mysql 服务
      run: tool/build.py chat_prepare

    - name: 构建所有目标
      run: bazel build //... --config=ci

    - name: 运行所有测试
      run: bazel test //... --config=ci --test_output=errors

    - name: 构建后状态（缓存保存前）
      run: |
        echo "===== 构建后磁盘状态 ====="
        df -h /
        echo ""
        echo "===== Bazel 相关目录占用 ====="
        du -sh ~/.cache/bazel* 2>/dev/null || echo "bazel 缓存不存在"
        du -sh $(bazel info output_base 2>/dev/null) 2>/dev/null || echo "output_base 不存在"
        echo ""
        echo "===== 工作目录占用 ====="
        du -sh /home/runner/work/pycstl 2>/dev/null || true

  coverage:
    name: Coverage (${{ matrix.os }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    steps:
    - name: 检出代码
      uses: actions/checkout@v7

    # TODO: adapt gcc 14
    - name: Remove GCC 14
      run: |
        sudo apt-get remove -y gcc-14 g++-14 libstdc++-14-dev
        sudo apt-get autoremove -y

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        # Avoid downloading Bazel every time.
        bazelisk-cache: true
        # Store build cache per workflow.
        disk-cache: ${{ github.workflow }}-${{ matrix.os }}-coverage
        # Share repository cache between workflows.
        repository-cache: false

    - name: 验证 Bazel 版本
      run: bazel --version

    - name: 启动 mysql 服务
      run: tool/build.py chat_prepare

    # --combined_report=lcov: 生成单个 lcov 格式报告
    # --test_output=errors: 只显示失败测试的日志，减少噪音
    - name: 生成测试覆盖率
      run: |
        bazel coverage //... \
          --config=ci \
          --combined_report=lcov \
          --test_output=errors \
          --nocache_test_results \
          --instrumentation_filter="//..."

    - name: 上传覆盖率报告
      if: runner.os == 'Linux'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./bazel-out/_coverage/_coverage_report.dat
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true

    - name: 构建后状态（缓存保存前）
      run: |
        echo "===== 构建后磁盘状态 ====="
        df -h /
        echo ""
        echo "===== Bazel 相关目录占用 ====="
        du -sh ~/.cache/bazel* 2>/dev/null || echo "bazel 缓存不存在"
        du -sh $(bazel info output_base 2>/dev/null) 2>/dev/null || echo "output_base 不存在"
        echo ""
        echo "===== 工作目录占用 ====="
        du -sh /home/runner/work/pycstl 2>/dev/null || true

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v7

    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: 缓存 pre-commit 环境
      uses: actions/cache@v4
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

    # 工具与版本全部由 .pre-commit-config.yaml 声明,与本地 pre-commit 完全一致
    - name: 检查代码格式
      run: |
        pipx install pre-commit
        pre-commit run --all-files --show-diff-on-failure
