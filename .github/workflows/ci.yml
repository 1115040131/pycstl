name: Bazel CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 同一分支/PR 有新推送时取消进行中的旧 run,避免堆积浪费额度。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限:仅需读取代码。
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    steps:
    - name: 检出代码
      uses: actions/checkout@v7

    - name: 准备构建环境
      uses: ./.github/actions/setup-env
      with:
        os: ${{ matrix.os }}
        cache-kind: build
        bb-key: ${{ secrets.BUILDBUDDY_API_KEY }}

    - name: 构建并测试
      run: bazel test //... --config=ci $BAZEL_REMOTE

  coverage:
    name: Coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    steps:
    - name: 检出代码
      uses: actions/checkout@v7

    - name: 准备构建环境
      uses: ./.github/actions/setup-env
      with:
        os: ${{ matrix.os }}
        cache-kind: coverage
        bb-key: ${{ secrets.BUILDBUDDY_API_KEY }}

    # 覆盖率相关 flag 全部在 .bazelrc 的 coverage / coverage:ci 段
    - name: 生成测试覆盖率
      run: bazel coverage //... --config=ci $BAZEL_REMOTE

    - name: 上传覆盖率报告
      if: runner.os == 'Linux'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./bazel-out/_coverage/_coverage_report.dat
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true

  nn-test:
    name: NN Test
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v7

    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: 'pip'
        cache-dependency-path: requirements_venv.in

    - name: 运行 micrograd 测试
      run: |
        # runner 没有 GPU, 先装 CPU 版 torch, 免得 pip 默认拉 2~3GB 的 CUDA 依赖。
        # 后一条会发现 torch 已满足而跳过, 其余依赖照常从 requirements_venv.in 装。
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements_venv.in
        python -m unittest discover -s nn/micrograd/test/ -t nn/micrograd/

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v7

    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: 缓存 pre-commit 环境
      uses: actions/cache@v4
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

    # 工具与版本全部由 .pre-commit-config.yaml 声明,与本地 pre-commit 完全一致
    - name: 检查代码格式
      run: |
        pipx install pre-commit
        pre-commit run --all-files --show-diff-on-failure
