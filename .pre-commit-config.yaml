# .pre-commit-config.yaml
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    # 本地与 CI 共用此版本(CI 直接跑 pre-commit),升级走 pre-commit autoupdate
    rev: v22.1.8
    hooks:
      - id: clang-format
        types: [c++]
        args: [--style=file]  # 使用项目中的 .clang-format 文件
        exclude: ^third_party/.*$  # 排除第三方代码

  - repo: https://github.com/keith/pre-commit-buildifier
    # 对应 buildtools 8.5.1(与 bazel 9.1.1 兼容),升级走 pre-commit autoupdate
    rev: 8.5.1.3
    hooks:
      # 覆盖 BUILD.bazel / MODULE.bazel / REPO.bazel / *.bzl
      - id: buildifier